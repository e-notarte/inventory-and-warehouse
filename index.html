<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Inventory &amp; Warehouse Management System - R-II Builders</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #1E355F;
      --primary-dark: #122240;
      --accent: #FCAE16;
      --accent-hover: #e59d0d;
      --bg: #f1f5f9;
      --bg-surface: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --shadow-lg: 0 20px 45px -12px rgba(15, 23, 42, 0.22);
    }

    body.dark-mode {
      --bg: #090d16;
      --bg-surface: #131c2e;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #fca5a5;
      --danger-bg: rgba(220, 38, 38, 0.14);
      --danger-border: rgba(248, 113, 113, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(252, 174, 22, 0.14), transparent 38%),
        radial-gradient(circle at 88% 82%, rgba(30, 53, 95, 0.16), transparent 42%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    .top-bar {
      background: var(--primary);
      color: #ffffff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--accent);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.78);
    }

    .theme-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .theme-btn:focus-visible,
    .pw-toggle-btn:focus-visible,
    .btn-signin:focus-visible,
    .form-input:focus-visible {
      outline: 3px solid #0284c7;
      outline-offset: 2px;
    }

    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .auth-card-banner {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #ffffff;
      padding: 26px 28px 22px;
      border-bottom: 3px solid var(--accent);
    }

    .auth-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .auth-card-banner h1 {
      font-size: 1.32rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .auth-card-banner p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 4px;
    }

    .auth-form {
      padding: 26px 28px 28px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-block-end: 1.25rem;
    }

    .form-field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .form-field label i {
      color: var(--accent);
    }

    .req-star {
      color: #ef4444;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      font: inherit;
      font-size: max(1rem, 1em);
      min-height: 48px;
      padding: 0.68rem 0.9rem;
      border-radius: 9px;
      border: 1.5px solid #767676;
      background: var(--bg-surface);
      color: var(--text);
      transition: border-color 0.15s;
    }

    .form-input.with-toggle {
      padding-inline-end: 3.1rem;
    }

    .form-input[aria-invalid="true"],
    .form-input:user-invalid {
      border-color: var(--danger);
    }

    .pw-toggle-btn {
      position: absolute;
      inset-inline-end: 6px;
      min-width: 40px;
      min-height: 40px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .pw-toggle-btn:hover {
      background: rgba(148, 163, 184, 0.16);
      color: var(--text);
    }

    .error-banner {
      display: none;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      margin-block-end: 1.15rem;
      border-radius: 8px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .error-banner.visible {
      display: flex;
    }

    .btn-signin {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 9px;
      background: var(--primary);
      color: #ffffff;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.18s;
    }

    .btn-signin:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-signin:disabled {
      opacity: 0.72;
      cursor: not-allowed;
    }

    .auth-footer-note {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 0.74rem;
      color: var(--text-muted);
      text-align: center;
    }

    .page-footer {
      text-align: center;
      padding: 14px 16px;
      font-size: 0.73rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <header class="top-bar">
    <div class="brand-wrap">
      <img src="RII_Logo.png" alt="R-II Builders Logo" class="brand-logo" onerror="this.style.display='none'">
      <div>
        <div class="brand-title">R-II BUILDERS, INC.</div>
        <div class="brand-sub">Inventory &amp; Warehouse Management System</div>
      </div>
    </div>
    <button type="button" class="theme-btn" id="themeToggleBtn" aria-label="Toggle dark mode" title="Toggle Dark/Light Mode">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="loginHeading">
      <div class="auth-card-banner">
        <div class="auth-eyebrow">
          <i class="fa-solid fa-shield-halved"></i> Warehouseman Portal
        </div>
        <h1 id="loginHeading">Sign in to Warehouse Dashboard</h1>
        <p>Enter your R-II Builders email and password to continue.</p>
      </div>

      <form id="loginForm" class="auth-form" method="POST" action="warehouseman-account.html" aria-labelledby="loginHeading" novalidate>
        <div id="loginErrorMsg" class="error-banner" role="alert" aria-live="polite">
          <i class="fa-solid fa-circle-exclamation" style="margin-top:2px;"></i>
          <span id="loginErrorText"></span>
        </div>

        <div class="form-field">
          <label for="loginEmail">
            <i class="fa-regular fa-envelope"></i> Email Address <span class="req-star" aria-hidden="true">*</span>
          </label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            class="form-input"
            autocomplete="username"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            enterkeyhint="next"
            placeholder="name@riibuilders.com"
            required>
        </div>

        <div class="form-field">
          <label for="loginPassword">
            <i class="fa-solid fa-lock"></i> Password <span class="req-star" aria-hidden="true">*</span>
          </label>
          <div class="input-wrap">
            <input
              type="password"
              id="loginPassword"
              name="password"
              class="form-input with-toggle"
              autocomplete="current-password"
              enterkeyhint="done"
              placeholder="Enter your password"
              required>
            <button
              type="button"
              id="togglePasswordBtn"
              class="pw-toggle-btn"
              aria-pressed="false"
              aria-label="Show password">
              <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn-signin">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Sign In</span>
        </button>

        <div class="auth-footer-note">
          Authenticated accounts proceed directly to <strong>Warehouseman Dashboard</strong>.
        </div>
      </form>
    </section>
  </main>

  <footer class="page-footer">
    Inventory &amp; Warehouse Module • R-II Builders, Inc. &copy; 2026
  </footer>

  <script type="module">
    import { supabase } from './supabase-client.js';

    const DASHBOARD_URL = 'warehouseman-account.html';

    // Theme initialization & toggle
    const themeIcon = document.getElementById('themeIcon');
    const savedTheme = localStorage.getItem('warehouse_theme') || 'light';
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      if (themeIcon) themeIcon.className = 'fa-solid fa-sun';
    }
    document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('warehouse_theme', isDark ? 'dark' : 'light');
      if (themeIcon) themeIcon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    });

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('togglePasswordIcon');
    const errorBox = document.getElementById('loginErrorMsg');
    const errorText = document.getElementById('loginErrorText');
    const submitBtn = document.getElementById('loginSubmitBtn');

    function showError(message, focusEl) {
      if (errorText) errorText.textContent = message;
      if (errorBox) errorBox.classList.add('visible');
      if (focusEl) {
        focusEl.setAttribute('aria-invalid', 'true');
        focusEl.focus();
      }
    }

    function clearError() {
      if (errorBox) errorBox.classList.remove('visible');
      if (errorText) errorText.textContent = '';
      emailInput?.removeAttribute('aria-invalid');
      passwordInput?.removeAttribute('aria-invalid');
    }

    emailInput?.addEventListener('input', clearError);
    passwordInput?.addEventListener('input', clearError);

    toggleBtn?.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      toggleBtn.setAttribute('aria-pressed', String(show));
      toggleBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      if (toggleIcon) toggleIcon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    });

    function persistSession(user) {
      const email = user?.email || '';
      const meta = user?.user_metadata || {};
      const fullName = meta.full_name || meta.name || (email ? email.split('@')[0] : 'Warehouseman');
      const role = meta.role || 'Warehouseman';

      sessionStorage.setItem('isAuthenticated', 'true');
      sessionStorage.setItem('userEmail', email);
      sessionStorage.setItem('userFullName', fullName);
      sessionStorage.setItem('userRole', role);
      if (user?.id) sessionStorage.setItem('userId', user.id);
    }

    // Redirect immediately if already authenticated with an active Supabase session
    (async () => {
      try {
        if (sessionStorage.getItem('isAuthenticated') === 'true') {
          const { data } = await supabase.auth.getSession();
          if (data?.session?.user) {
            persistSession(data.session.user);
            window.location.replace(DASHBOARD_URL);
          } else {
            sessionStorage.removeItem('isAuthenticated');
          }
        }
      } catch (e) { }
    })();

    form?.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email = (emailInput?.value || '').trim();
      const password = passwordInput?.value || '';

      if (!email) {
        showError('Please enter your email address.', emailInput);
        return;
      }
      if (!emailInput.checkValidity()) {
        showError('Please enter a valid email address.', emailInput);
        return;
      }
      if (!password) {
        showError('Please enter your password.', passwordInput);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Signing In...</span>';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          emailInput?.setAttribute('aria-invalid', 'true');
          passwordInput?.setAttribute('aria-invalid', 'true');
          showError(error.message || 'Invalid email or password. Please try again.', passwordInput);
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Sign In</span>';
          return;
        }

        if (!data?.user) {
          showError('Authentication succeeded without a user session. Please try again.', emailInput);
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Sign In</span>';
          return;
        }

        persistSession(data.user);
        window.location.replace(DASHBOARD_URL);
      } catch (err) {
        showError(err?.message || 'Unable to reach authentication service. Please check your connection.', emailInput);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Sign In</span>';
      }
    });
  </script>
</body>

</html>
